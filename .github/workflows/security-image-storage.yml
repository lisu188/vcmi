name: Image and map storage source fixtures
on:
  pull_request:
    paths:
      - 'client/render/hdEdition/DdsFormat.cpp'
      - 'client/render/hdEdition/DdsFormat.h'
      - 'lib/mapping/MapTilesStorage.h'
      - 'test/security/test_image_storage_valid_fixtures.py'
      - '.github/workflows/security-image-storage.yml'
  push:
    branches: [develop]
    paths:
      - 'client/render/hdEdition/DdsFormat.cpp'
      - 'client/render/hdEdition/DdsFormat.h'
      - 'lib/mapping/MapTilesStorage.h'
      - 'test/security/test_image_storage_valid_fixtures.py'
      - '.github/workflows/security-image-storage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  valid-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Compile and run ordinary valid-data source fixtures
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: python3 test/security/test_image_storage_valid_fixtures.py -v
