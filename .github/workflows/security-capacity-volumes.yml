name: Pathfinder capacity and template volume source fixtures
on:
  pull_request:
    paths:
      - 'AI/Nullkiller2/Engine/Settings.cpp'
      - 'AI/Nullkiller2/Engine/PathfinderCapacity.h'
      - 'AI/Nullkiller2/Pathfinding/AINodeStorage.cpp'
      - 'lib/rmg/CRmgTemplate.cpp'
      - 'config/ai/nk2ai/nk2ai-settings.json'
      - 'test/security/test_capacity_volume_valid_fixtures.py'
      - '.github/workflows/security-capacity-volumes.yml'
  push:
    branches: [develop]
    paths:
      - 'AI/Nullkiller2/Engine/Settings.cpp'
      - 'AI/Nullkiller2/Engine/PathfinderCapacity.h'
      - 'AI/Nullkiller2/Pathfinding/AINodeStorage.cpp'
      - 'lib/rmg/CRmgTemplate.cpp'
      - 'config/ai/nk2ai/nk2ai-settings.json'
      - 'test/security/test_capacity_volume_valid_fixtures.py'
      - '.github/workflows/security-capacity-volumes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  valid-capacities:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Ensure the existing Boost header dependency is available
        run: |
          if ! test -f /usr/include/boost/multiprecision/cpp_int.hpp; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libboost-dev
          fi
      - name: Compile and run ordinary configured capacity/volume fixtures
        run: python3 test/security/test_capacity_volume_valid_fixtures.py -v
