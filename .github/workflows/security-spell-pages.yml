name: Spell-list page source fixtures
on:
  pull_request:
    paths:
      - 'client/windows/CSpellWindow.cpp'
      - 'client/windows/SpellPageRange.h'
      - 'test/security/test_spell_pages_valid_fixtures.py'
      - '.github/workflows/security-spell-pages.yml'
  push:
    branches: [develop]
    paths:
      - 'client/windows/CSpellWindow.cpp'
      - 'client/windows/SpellPageRange.h'
      - 'test/security/test_spell_pages_valid_fixtures.py'
      - '.github/workflows/security-spell-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  valid-page-layouts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Compile and run ordinary spell-list rebuild/page fixtures
        run: python3 test/security/test_spell_pages_valid_fixtures.py -v
