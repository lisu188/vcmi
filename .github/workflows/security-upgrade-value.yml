name: Upgrade value source fixtures
on:
  pull_request:
    paths:
      - 'AI/Nullkiller2/Analyzers/ArmyManager.cpp'
      - 'test/security/test_upgrade_value_valid_fixtures.py'
      - '.github/workflows/security-upgrade-value.yml'
  push:
    branches: [develop]
    paths:
      - 'AI/Nullkiller2/Analyzers/ArmyManager.cpp'
      - 'test/security/test_upgrade_value_valid_fixtures.py'
      - '.github/workflows/security-upgrade-value.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  valid-upgrade-values:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Compile and run ordinary upgrade-value fixtures
        run: python3 test/security/test_upgrade_value_valid_fixtures.py -v
